AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Transit Gateway with Network Firewall, three Production VPCs (six EC2 instances)
  and an Inspection VPC. All instances use SSM (via IAM Instance Profile) for access.
  This template includes complete UserData scripts for all instances and centralized
  traffic inspection via the transit gateway with required tags.

Parameters:
  InstanceType:
    Type: String
    Default: 't3.micro'
  FirewallName:
    Type: String
    Description: Name of the network firewall (used in both firewall and dashboard)
    Default: 'CentralizedFirewall'
  ContributorInsightsRuleState:
        Type: String
        Description: Choose to enable or disable the Contributor Insight rules created by this template
        Default: ENABLED
        AllowedValues:
          - ENABLED
          - DISABLED
  FirewallAlertLogGroupName:
    Type: String
    Description: Name of the Firewall Alert Log Group
    Default: '/aws/network-firewall/alert'
  
  FirewallFlowLogGroupName:
    Type: String
    Description: Name of the Firewall Flow Log Group
    Default: '/aws/network-firewall/flow'

  InspectionAlbSubnet1Cidr:
    Type: String
    Default: 10.0.9.0/24

  InspectionAlbSubnet2Cidr:
    Type: String
    Default: 10.0.10.0/24

  InspectionAppSubnet1Cidr:
    Type: String
    Default: 10.0.11.0/24

  InspectionAppSubnet2Cidr:
    Type: String
    Default: 10.0.12.0/24

  AppInstanceType:
    Type: String
    Default: t3.micro

  ApplianceInstanceType:
    Type: String
    Default: c5.large

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64

  ScopeTagsJson:
    Type: String
    Default: "{}"
    Description: JSON object of tags to apply to the scope, e.g. {"Env":"prod","Owner":"netops"}

Mappings: 
  UserDataScripts:
    WebApp:
      Script: |
        #!/bin/bash
        yum update -y

        # For Amazon Linux 2, use this:
        # amazon-linux-extras install nginx1 -y
        # For Amazon Linux 2023 or if nginx is in default repos, use:
        yum install nginx -y
        yum install amazon-cloudwatch-agent -y

        yum install stress -y
        yum install -y awscli cronie
        yum install -y network-flow-monitor-agent

        systemctl enable nginx
        systemctl start nginx

        # Create log directory
        mkdir -p /var/log/custom-scripts
        chmod 755 /var/log/custom-scripts

        # Set direct GitHub URLs
        SOLAR_URL="https://github.com/aws-samples/visualize-and-gain-Insights-into-your-VPC-with-Amazon-Q-in-Amazon-QuickSight/blob/main/enriched-vpc-flowlogs-with-quicksight-q/images/solar.jpg?raw=true"
        WIND_URL="https://github.com/aws-samples/visualize-and-gain-Insights-into-your-VPC-with-Amazon-Q-in-Amazon-QuickSight/blob/main/enriched-vpc-flowlogs-with-quicksight-q/images/wind.jpg?raw=true"
        HYDRO_URL="https://github.com/aws-samples/visualize-and-gain-Insights-into-your-VPC-with-Amazon-Q-in-Amazon-QuickSight/blob/main/enriched-vpc-flowlogs-with-quicksight-q/images/hydro.jpg?raw=true"
        ENERGY_URL="https://github.com/aws-samples/visualize-and-gain-Insights-into-your-VPC-with-Amazon-Q-in-Amazon-QuickSight/blob/main/enriched-vpc-flowlogs-with-quicksight-q/images/energy.jpeg?raw=true"

        ###############
        # index.html
        ###############
        cat > /usr/share/nginx/html/index.html << 'INDEXHTML'
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AnyCompany Energy - Home</title>
          <!-- Bootstrap CSS -->
          <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
          <style>
            body { background-color: #f8f9fa; }
            .carousel-item img { height: 600px; object-fit: cover; width: 100%; }
            .jumbotron { background: url('ENERGY_URL_PLACEHOLDER') no-repeat center center; background-size: cover; color: white; }
          </style>
        </head>
        <body>
          <!-- Navigation Bar -->
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="index.html">AnyCompany Energy</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav ml-auto">
                <li class="nav-item active"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
              </ul>
            </div>
          </nav>

          <!-- Carousel -->
          <div id="energyCarousel" class="carousel slide" data-ride="carousel">
            <ol class="carousel-indicators">
              <li data-target="#energyCarousel" data-slide-to="0" class="active"></li>
              <li data-target="#energyCarousel" data-slide-to="1"></li>
              <li data-target="#energyCarousel" data-slide-to="2"></li>
            </ol>
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="SOLAR_URL_PLACEHOLDER" alt="Solar Energy">
                <div class="carousel-caption d-none d-md-block">
                  <h5>Solar Power</h5>
                  <p>Harnessing the power of the sun.</p>
                </div>
              </div>
              <div class="carousel-item">
                <img src="WIND_URL_PLACEHOLDER" alt="Wind Energy">
                <div class="carousel-caption d-none d-md-block">
                  <h5>Wind Energy</h5>
                  <p>Innovative wind solutions.</p>
                </div>
              </div>
              <div class="carousel-item">
                <img src="HYDRO_URL_PLACEHOLDER" alt="Hydro Energy">
                <div class="carousel-caption d-none d-md-block">
                  <h5>Hydro Power</h5>
                  <p>Reliable water power systems.</p>
                </div>
              </div>
            </div>
            <a class="carousel-control-prev" href="#energyCarousel" role="button" data-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#energyCarousel" role="button" data-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="sr-only">Next</span>
            </a>
          </div>

          <!-- Jumbotron -->
          <div class="jumbotron text-center mt-4">
            <h1 class="display-4">Welcome to AnyCompany Energy</h1>
            <p class="lead">Empowering a sustainable future with innovative energy solutions.</p>
            <hr class="my-4">
            <p>Discover how our renewable energy initiatives can benefit you and the environment.</p>
            <a class="btn btn-primary btn-lg" href="services.html" role="button">Learn More</a>
          </div>

          <!-- Footer -->
          <footer class="bg-dark text-white text-center p-3">
            &copy; 2025 AnyCompany Energy. All rights reserved.
          </footer>

          <!-- Bootstrap JS and dependencies -->
          <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
        </body>
        </html>
        INDEXHTML

        # Replace URL placeholders in index.html
        sed -i "s|SOLAR_URL_PLACEHOLDER|${SOLAR_URL}|g" /usr/share/nginx/html/index.html
        sed -i "s|WIND_URL_PLACEHOLDER|${WIND_URL}|g" /usr/share/nginx/html/index.html
        sed -i "s|HYDRO_URL_PLACEHOLDER|${HYDRO_URL}|g" /usr/share/nginx/html/index.html
        sed -i "s|ENERGY_URL_PLACEHOLDER|${ENERGY_URL}|g" /usr/share/nginx/html/index.html

        ###############
        # about.html
        ###############
        cat > /usr/share/nginx/html/about.html << 'ABOUTHTML'
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AnyCompany Energy - About</title>
          <!-- Bootstrap CSS -->
          <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
          <style> body { background-color: #f8f9fa; } </style>
        </head>
        <body>
          <!-- Navigation Bar -->
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
