  #Flow Logs and CloudWatch Log Groups
  WorkloadVPC1FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vpc/flowlogs/${WorkloadVPC1}"
      RetentionInDays: 7

  WorkloadVPC2FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vpc/flowlogs/${WorkloadVPC2}"
      RetentionInDays: 7

  OnpremiseVPCFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vpc/flowlogs/${OnpremiseVPC}"
      RetentionInDays: 7

  InspectionVPCFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vpc/flowlogs/${InspectionVPC}"
      RetentionInDays: 7

  # IAM Role for Flow Logs with scoped permissions
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flowlogs-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource:
                  - !GetAtt WorkloadVPC1FlowLogGroup.Arn
                  - !GetAtt WorkloadVPC2FlowLogGroup.Arn
                  - !GetAtt OnpremiseVPCFlowLogGroup.Arn
                  - !GetAtt InspectionVPCFlowLogGroup.Arn

  # VPC Flow Logs for WorkloadVPC1 (using default format)
  WorkloadVPC1FlowLog:
    Type: AWS::EC2::FlowLog
    DependsOn: FlowLogRole
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      LogGroupName: !Ref WorkloadVPC1FlowLogGroup
      ResourceId: !Ref WorkloadVPC1
      ResourceType: VPC
      TrafficType: ALL

  # VPC Flow Logs for WorkloadVPC2 (using default format)
  WorkloadVPC2FlowLog:
    Type: AWS::EC2::FlowLog
    DependsOn: FlowLogRole
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      LogGroupName: !Ref WorkloadVPC2FlowLogGroup
      ResourceId: !Ref WorkloadVPC2
      ResourceType: VPC
      TrafficType: ALL

  # VPC Flow Logs for OnpremiseVPC (using default format)
  OnpremiseVPCFlowLog:
    Type: AWS::EC2::FlowLog
    DependsOn: FlowLogRole
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      LogGroupName: !Ref OnpremiseVPCFlowLogGroup
      ResourceId: !Ref OnpremiseVPC
      ResourceType: VPC
      TrafficType: ALL

  # VPC Flow Logs for InspectionVPC (using default format)
  InspectionVPCFlowLog:
    Type: AWS::EC2::FlowLog
    DependsOn: FlowLogRole
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      LogGroupName: !Ref InspectionVPCFlowLogGroup
      ResourceId: !Ref InspectionVPC
      ResourceType: VPC
      TrafficType: ALL

  # CloudWatch Log Group for Site-to-Site VPN Logs
  VPNLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vpn/${AWS::StackName}-vpn-logs"
      RetentionInDays: 7


  # Initialize Network Flow Monitor
  NfmScopeFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: NfmScopeCrud
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - networkflowmonitor:CreateScope
                  - networkflowmonitor:UpdateScope
                  - networkflowmonitor:DeleteScope
                  - networkflowmonitor:GetScope
                  - networkflowmonitor:ListScopes
                  - networkflowmonitor:TagResource
                  - networkflowmonitor:UntagResource
                  - networkflowmonitor:ListTagsForResource
                  - iam:GetRole 
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: 
                  - "arn:aws:iam::*:role/aws-service-role/topology.networkflowmonitor.amazonaws.com/AWSServiceRoleForNetworkFlowMonitor_Topology"
                  - "arn:aws:iam::*:role/aws-service-role/networkflowmonitor.amazonaws.com/AWSServiceRoleForNetworkFlowMonitor"
                Condition:
                  StringLike:
                    "iam:AWSServiceName": 
                      - "networkflowmonitor.amazonaws.com"
                      - "topology.networkflowmonitor.amazonaws.com"

  NfmScopeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt NfmScopeFunctionRole.Arn
      Timeout: 180
      Code:
        ZipFile: |
          import boto3, json, logging, os, uuid, urllib.request
          log = logging.getLogger(__name__)
          log.setLevel(logging.INFO)
          nfm = boto3.client('networkflowmonitor')
          def send(event, context, status, data=None, phys_id=None, reason=None):
              resp = {
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Log Stream: {context.log_stream_name}",
                  "PhysicalResourceId": phys_id or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {},
              }
              body = json.dumps(resp).encode("utf-8")
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                           headers={"content-type": "", "content-length": str(len(body))})
              with urllib.request.urlopen(req) as r:
                  r.read()
          def parse_json_param(s, name):
              try:
                  return json.loads(s)
              except Exception as e:
                  raise ValueError(f"{name} must be valid JSON: {e}")
          def handler(event, context):
              log.info("Event: %s", json.dumps(event))
              props = event.get("ResourceProperties", {})
              targets = parse_json_param(props.get("ScopeTargetsJson", "[]"), "ScopeTargetsJson")
              tags = parse_json_param(props.get("ScopeTagsJson", "{}"), "ScopeTagsJson")
              try:
                  if event["RequestType"] == "Create":
                      token = str(uuid.uuid4())
                      resp = nfm.create_scope(targets=targets, tags=tags, clientToken=token)
                      scope_id = resp["scopeId"]
                      info = nfm.get_scope(scopeId=scope_id)
                      data = {"ScopeId": scope_id, "ScopeArn": info["scopeArn"], "Status": info["status"]}
                      return send(event, context, "SUCCESS", data=data, phys_id=scope_id)
                  elif event["RequestType"] == "Update":
                      scope_id = event["PhysicalResourceId"]
                      # Update targets & tags (simple overwrite model)
                      nfm.update_scope(scopeId=scope_id, targets=targets)
                      # Sync tags (compute delta)
                      arn = nfm.get_scope(scopeId=scope_id)["scopeArn"]
                      current = nfm.list_tags_for_resource(resourceArn=arn)["tags"]
                      # Untag removed keys
                      remove = [k for k in current.keys() if k not in tags]
                      if remove:
                          nfm.untag_resource(resourceArn=arn, tagKeys=remove)
                      if tags:
                          nfm.tag_resource(resourceArn=arn, tags=tags)
                      info = nfm.get_scope(scopeId=scope_id)
                      data = {"ScopeId": scope_id, "ScopeArn": info["scopeArn"], "Status": info["status"]}
                      return send(event, context, "SUCCESS", data=data, phys_id=scope_id)
                  elif event["RequestType"] == "Delete":
                      scope_id = event.get("PhysicalResourceId")
                      if scope_id and not scope_id.startswith("arn:"):
                          try:
                              nfm.delete_scope(scopeId=scope_id)
                          except Exception as e:
                              # If it's already gone or never created, make delete idempotent
                              msg = str(e)
                              if "ResourceNotFoundException" not in msg:
                                  raise
                      return send(event, context, "SUCCESS", data={"Deleted": True}, phys_id=scope_id or "deleted")
              except Exception as e:
                  log.exception("Failed")
                  return send(event, context, "FAILED", reason=str(e))

  NfmScope:
    Type: Custom::NfmScope
    Properties:
      ServiceToken: !GetAtt NfmScopeFunction.Arn
      ScopeTargetsJson: !Sub |
        [
          {
            "targetIdentifier": {
              "targetId": { "accountId": "${AWS::AccountId}" },
              "targetType": "ACCOUNT"
            },
            "region": "${AWS::Region}"
          }
        ]
      ScopeTagsJson: !Ref ScopeTagsJson

  # TRAFFIC MIRROR NETWORK LOAD BALANCER
  TrafficMirrorNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: Traffic-Mirror-NLB
      Type: network
      Scheme: internal
      IpAddressType: ipv4
      Subnets:
        - !Ref InspectionAppSubnet1
        - !Ref InspectionAppSubnet2
      Tags:
        - Key: Name
          Value: Traffic-Mirror-NLB
        - Key: Environment
          Value: Inspection

  TrafficMirrorTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Traffic-Mirror-UDP-TG
      Port: 4789
      Protocol: UDP
      VpcId: !Ref InspectionVPC
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 300
      HealthCheckPort: 22
      HealthCheckProtocol: TCP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Targets:
        - Id: !Ref TrafficMirrorTarget1
          Port: 4789
        - Id: !Ref TrafficMirrorTarget2
          Port: 4789
      Tags:
        - Key: Name
          Value: Traffic-Mirror-TargetGroup
        - Key: Environment
          Value: Inspection

  TrafficMirrorNLBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TrafficMirrorTargetGroup
      LoadBalancerArn: !Ref TrafficMirrorNLB
      Port: 4789
      Protocol: UDP

  # TRAFFIC MIRROR TARGET EC2 INSTANCES
  TrafficMirrorTarget1:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref InspectionAppSubnet1
      SecurityGroupIds:
        - !Ref InspectionEC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      Tags:
        - Key: Name
          Value: Traffic-Mirror-Target1
        - Key: Environment
          Value: Inspection
      UserData:
        'Fn::Base64': !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Traffic Mirror Target 1 - $(hostname -f)</h1>" > /var/www/html/index.html
          echo "<p>Private IP: $(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)</p>" >> /var/www/html/index.html
          echo "<p>Availability Zone: $(curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone)</p>" >> /var/www/html/index.html
          echo "<p>Instance ID: $(curl -s http://169.254.169.254/latest/meta-data/instance-id)</p>" >> /var/www/html/index.html

  TrafficMirrorTarget2:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref InspectionAppSubnet2
      SecurityGroupIds:
        - !Ref InspectionEC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      Tags:
        - Key: Name
          Value: Traffic-Mirror-Target2
        - Key: Environment
          Value: Inspection
      UserData:
        'Fn::Base64': !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Traffic Mirror Target 2 - $(hostname -f)</h1>" > /var/www/html/index.html
          echo "<p>Private IP: $(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)</p>" >> /var/www/html/index.html
          echo "<p>Availability Zone: $(curl -s http://169.254.169.254/latest/meta-data/placement/availability-zone)</p>" >> /var/www/html/index.html
          echo "<p>Instance ID: $(curl -s http://169.254.169.254/latest/meta-data/instance-id)</p>" >> /var/www/html/index.html

  

