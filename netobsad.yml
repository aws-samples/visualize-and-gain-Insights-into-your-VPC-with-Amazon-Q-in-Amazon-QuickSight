        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y python3-pip cronie telnet
          systemctl enable crond
          systemctl start crond
          
          # Get ALB DNS name and store it in a variable
          ALB_DNS="${IngressALB.DNSName}"

          # Create virtual environment
          python3 -m venv /home/ec2-user/locust_venv
          source /home/ec2-user/locust_venv/bin/activate
          
          # Install Locust in virtual environment
          pip3 install locust
          chmod +x /home/ec2-user/locust_venv/bin/locust
          
          cat << 'EOF' > /home/ec2-user/locustfile.py
          from locust import HttpUser, task, between
          class WebsiteUser(HttpUser):
              wait_time = between(1, 2)
              @task
              def check_website(self):
                  self.client.get("/")
          EOF
          
          # Update cron jobs to use the virtual environment's Locust
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://$ALB_DNS/about.html --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://$ALB_DNS/index.html --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://$ALB_DNS/contact.html --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://$ALB_DNS/services.html --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://$ALB_DNS/ --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
