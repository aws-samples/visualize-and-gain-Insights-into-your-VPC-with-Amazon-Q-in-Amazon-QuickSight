      VpcEndpointType: Interface
      SubnetIds: [!Ref OnpremiseSubnet4]
      SecurityGroupIds: [!Ref OnPremisesInstanceSG]
      PrivateDnsEnabled: true

  OnpremiseSSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref OnpremiseVPC
