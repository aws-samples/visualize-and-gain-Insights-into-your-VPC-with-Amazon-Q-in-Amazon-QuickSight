      SubnetId: !Ref InspectionTgwSubnet1
      RouteTableId: !Ref InspectionTgwRouteTable

  InspectionTgwSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref InspectionTgwSubnet2
      RouteTableId: !Ref InspectionTgwRouteTable

  # ALB subnet associations
  InspectionAlbSubnet1RouteTableAssociation:
