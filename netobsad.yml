  SecurityGroup1:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS/DNS outbound and SSH between workloads
      VpcId: !Ref WorkloadVPC1

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.2.0.0/16
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.3.0.0/16

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  SecurityGroup2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS/DNS outbound and SSH between workloads
      VpcId: !Ref WorkloadVPC2

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.1.0.0/16
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.3.0.0/16

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  SecurityGroup3:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS/DNS outbound and SSH between workloads
      VpcId: !Ref OnpremiseVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.1.0.0/16
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.2.0.0/16

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0


  
  # ------------------------------
  # StrongSWAN, ALB, 3rd party
  # ------------------------------
  StrongSwanEIP:
    Type: AWS::EC2::EIP
    DependsOn: OnPremisesIGWAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: StrongSwan-VPN-EIP

  CustomerGateway:
    Type: AWS::EC2::CustomerGateway
    Properties:
      Type: ipsec.1
      BgpAsn: 65000
      IpAddress: !Ref StrongSwanEIP
      Tags:
        - Key: Name
          Value: OnPremises-Customer-Gateway


  StrongSwanSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for StrongSwan VPN instance
      VpcId: !Ref OnpremiseVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: udp
          FromPort: 500
          ToPort: 500
          CidrIp: 0.0.0.0/0
          Description: IKE
        - IpProtocol: udp
          FromPort: 4500
          ToPort: 4500
          CidrIp: 0.0.0.0/0
          Description: IPSec NAT-T
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: ICMP access
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: "Allow all outbound traffic"
      Tags:
        - Key: Name
          Value: StrongSwan-VPN-SG

  OnPremisesInstanceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for On-premises instance
      VpcId: !Ref OnpremiseVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 192.168.0.0/16
          Description: SSH access from on-premises
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.0.0/8
          Description: HTTP access from AWS VPCs
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/8
          Description: HTTPS access from AWS VPCs
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/8
          Description: ICMP access from AWS VPCs
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.3.0.0/16
          Description: HTTPS for SSM endpoints
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: "Allow all outbound traffic"
      Tags:
        - Key: Name
          Value: OnPremises-Instance-SG
  TrafficGeneratorSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Traffic Generator instance
      VpcId: !Ref OnpremiseVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP outbound
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS outbound

    # EC2 Instances
  StrongSwanInstance:
    Type: AWS::EC2::Instance
    DependsOn: TransitGatewayVpnConnection
    Properties:
      IamInstanceProfile: !Ref EC2InstanceProfile
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-kernel-5.10-hvm-x86_64-gp2}}'
      InstanceType: t3.small
      SubnetId: !Ref OnpremiseSubnet3
      SecurityGroupIds:
        - !Ref StrongSwanSG
      SourceDestCheck: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          amazon-linux-extras install epel
          yum update -y
          yum install -y strongswan aws-cli jq

          # Get VPN connection details
          VPN_CONNECTION_ID="${TransitGatewayVpnConnection}"

          # Retrieve VPN connection configuration
          VPN_CONFIG=$(aws ec2 describe-vpn-connections --vpn-connection-ids $VPN_CONNECTION_ID --region ${AWS::Region} --output json)

          # Extract tunnel information
          TUNNEL_1_IP=$(echo $VPN_CONFIG | jq -r '.VpnConnections[0].Options.TunnelOptions[0].OutsideIpAddress')
          TUNNEL_2_IP=$(echo $VPN_CONFIG | jq -r '.VpnConnections[0].Options.TunnelOptions[1].OutsideIpAddress')
          TUNNEL_1_PSK=$(echo $VPN_CONFIG | jq -r '.VpnConnections[0].Options.TunnelOptions[0].PreSharedKey')
          TUNNEL_2_PSK=$(echo $VPN_CONFIG | jq -r '.VpnConnections[0].Options.TunnelOptions[1].PreSharedKey')

          # Export variables for the script
          export VPN_CONNECTION_ID="$VPN_CONNECTION_ID"
          export TUNNEL_1_IP="$TUNNEL_1_IP"
          export TUNNEL_2_IP="$TUNNEL_2_IP"
          export TUNNEL_1_PSK="$TUNNEL_1_PSK"
          export TUNNEL_2_PSK="$TUNNEL_2_PSK"

          # Get local IPs using IMDSv2
          TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
          LOCAL_PUBLIC_IP=$(curl -H "X-aws-ec2-metadata-token: $$TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)
          LOCAL_PRIVATE_IP=$(curl -H "X-aws-ec2-metadata-token: $$TOKEN" http://169.254.169.254/latest/meta-data/local-ipv4)

          echo "Configuring StrongSwan VPN..."
          echo "Local Public IP: $LOCAL_PUBLIC_IP"
          echo "Local Private IP: $LOCAL_PRIVATE_IP"
          echo "Tunnel 1: $TUNNEL_1_IP"
          echo "Tunnel 2: $TUNNEL_2_IP"

          # Create directories
          mkdir -p /etc/strongswan
          mkdir -p /etc/iptables

          # Backup original configuration
          cp /etc/strongswan/ipsec.conf /etc/strongswan/ipsec.conf.backup 2>/dev/null || true
          cp /etc/strongswan/ipsec.secrets /etc/strongswan/ipsec.secrets.backup 2>/dev/null || true

          # Configure ipsec.conf
          cat > /etc/strongswan/ipsec.conf << IPSEC_CONF
          # StrongSwan configuration for AWS VPN
          config setup
              charondebug="ike 1, knl 1, cfg 0"
              uniqueids=no

          # Connection to AWS VPN Tunnel 1
          conn aws-tunnel-1
              auto=start
              left=%defaultroute
              leftid=$LOCAL_PUBLIC_IP
              leftsubnet=10.3.0.0/16
              right=$TUNNEL_1_IP
              rightsubnet=10.0.0.0/8
              ike=aes128-sha1-modp1024!
              esp=aes128-sha1-modp1024!
              keyingtries=0
              ikelifetime=1h
              lifetime=8h
              dpddelay=10
              dpdtimeout=30
              dpdaction=restart
              authby=secret

          # Connection to AWS VPN Tunnel 2 (backup)
          conn aws-tunnel-2
              auto=route
              left=%defaultroute
              leftid=$LOCAL_PUBLIC_IP
              leftsubnet=10.3.0.0/16
              right=$TUNNEL_2_IP
              rightsubnet=10.0.0.0/8
              ike=aes128-sha1-modp1024!
              esp=aes128-sha1-modp1024!
              keyingtries=0
              ikelifetime=1h
              lifetime=8h
              dpddelay=10
              dpdtimeout=30
              dpdaction=restart
              authby=secret
          IPSEC_CONF

          # Configure ipsec.secrets
          cat > /etc/strongswan/ipsec.secrets << IPSEC_SECRETS
          # Pre-shared keys for AWS VPN tunnels
          $LOCAL_PUBLIC_IP $TUNNEL_1_IP : PSK "$TUNNEL_1_PSK"
          $LOCAL_PUBLIC_IP $TUNNEL_2_IP : PSK "$TUNNEL_2_PSK"
          IPSEC_SECRETS

          # Set proper permissions
          chmod 600 /etc/strongswan/ipsec.secrets

          # Configure sysctl for IP forwarding
          cat >> /etc/sysctl.conf << 'SYSCTL_CONF'
          # IP Forwarding
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1

          # Disable ICMP redirects
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0

          # Disable source routing
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0

          # IPSec settings
          net.ipv4.conf.all.rp_filter = 0
          net.ipv4.conf.default.rp_filter = 0
          net.ipv4.conf.eth0.rp_filter = 0
          SYSCTL_CONF

          # Apply sysctl settings
          sysctl -p

          # Configure iptables rules
          cat > /etc/strongswan/iptables-rules.sh << 'IPTABLES_SCRIPT'
          #!/bin/bash

          # Flush existing rules
          iptables -F
          iptables -t nat -F
          iptables -t mangle -F

          # Set default policies
          iptables -P INPUT ACCEPT
          iptables -P FORWARD ACCEPT
          iptables -P OUTPUT ACCEPT

          # Allow loopback
          iptables -A INPUT -i lo -j ACCEPT
          iptables -A OUTPUT -o lo -j ACCEPT

          # Allow established and related connections
          iptables -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
          iptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT

          # Allow SSH
          iptables -A INPUT -p tcp --dport 22 -j ACCEPT

          # Allow VPN traffic
          iptables -A INPUT -p udp --dport 500 -j ACCEPT
          iptables -A INPUT -p udp --dport 4500 -j ACCEPT
          iptables -A INPUT -p esp -j ACCEPT

          # Allow ICMP
          iptables -A INPUT -p icmp -j ACCEPT
          iptables -A FORWARD -p icmp -j ACCEPT

          # NAT for outbound traffic from OnPremise subnet
          iptables -t nat -A POSTROUTING -s 10.3.4.0/24 -o eth0 -j MASQUERADE

          # Forward traffic between VPN and local networks
          iptables -A FORWARD -s 10.3.0.0/16 -d 10.0.0.0/8 -j ACCEPT
          iptables -A FORWARD -s 10.0.0.0/8 -d 10.3.0.0/16 -j ACCEPT

          # Forward traffic from OnPremise subnet to internet
          iptables -A FORWARD -s 10.3.4.0/24 -j ACCEPT

          # Save iptables rules
          if command -v iptables-save &> /dev/null; then
              iptables-save > /etc/iptables/rules.v4 2>/dev/null || true
          fi
          IPTABLES_SCRIPT

          chmod +x /etc/strongswan/iptables-rules.sh
          /etc/strongswan/iptables-rules.sh

          # Start and enable StrongSwan
          systemctl enable strongswan
          systemctl restart strongswan

          # Wait for StrongSwan to start
          sleep 5

          # Check status and log to CloudWatch
          echo "=== StrongSwan Status ===" >> /var/log/vpn-setup.log
          systemctl status strongswan --no-pager -l >> /var/log/vpn-setup.log

          echo "=== IPSec Status ===" >> /var/log/vpn-setup.log
          ipsec status >> /var/log/vpn-setup.log

          # Signal CloudFormation that setup is complete
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource VPNServerInstance --region ${AWS::Region}
        
      Tags:
        - Key: Name
          Value: StrongSwan-VPN-Instance

