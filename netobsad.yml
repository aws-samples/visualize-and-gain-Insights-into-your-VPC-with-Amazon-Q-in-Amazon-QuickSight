      SubnetId: !Ref OnpremiseSubnet4
      RouteTableId: !Ref OnpremiseInstanceRouteTable

  # ------------------------------
  # Security Groups (ALB <-> App) - Moved to Inspection VPC
  # ------------------------------
  IngressAlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB SG
      VpcId: !Ref InspectionVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1  
          FromPort: -1    
          ToPort: -1     
          CidrIp: 0.0.0.0/0
          Description: "Allow all outbound traffic"
      Tags: [{ Key: Name, Value: Ingress-ALB-SG }]

  IngressAppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App SG (only ALB to port 80)
      VpcId: !Ref InspectionVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref IngressAlbSg
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: Ingress-App-SG }]

  InspectionEC2SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Security group for Inspection VPC EC2 instances
      VpcId: !Ref InspectionVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.2.0.0/16
          Description: HTTP from Inspection VPC
        - IpProtocol: udp
          FromPort: 4789
          ToPort: 4789
          CidrIp: 10.1.0.0/16
          Description: VXLAN traffic mirror from Prod VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0

  ProdEndpointSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Security group for Prod VPC Flow Monitor Endpoints
      VpcId: !Ref InspectionVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16  # Prod VPC CIDR
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Prod-Endpoint-SG

  # ------------------------------
  # Flask App instances (private) - Moved to Inspection VPC
  # ------------------------------

    # Launch Templates
  GoodAppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-good-app-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref AppInstanceType
        SecurityGroupIds: [ !Ref IngressAppSg ]
        IamInstanceProfile:
          Name: !Ref EC2InstanceProfile
        UserData:
          Fn::Base64: !FindInMap [UserDataScripts, WebApp, Script]

  BadAppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-bad-app-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref AppInstanceType
        SecurityGroupIds: [ !Ref IngressAppSg ]
        IamInstanceProfile:
          Name: !Ref EC2InstanceProfile
        UserData:
          Fn::Base64: !FindInMap [UserDataScripts, BadApp, Script]

  # Auto Scaling Groups
  GoodAppASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${AWS::StackName}-good-app-asg
      VPCZoneIdentifier: 
        - !Ref InspectionAppSubnet1
        - !Ref InspectionAppSubnet2
      DesiredCapacity: 2
      MinSize: 2
      MaxSize: 4
      TargetGroupARNs:
        - !Ref IngressAlbTgSmall
      LaunchTemplate:
        LaunchTemplateId: !Ref GoodAppLaunchTemplate
        Version: !GetAtt GoodAppLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-good-app
          PropagateAtLaunch: true

  BadAppASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${AWS::StackName}-bad-app-asg
      VPCZoneIdentifier: 
        - !Ref InspectionAppSubnet1
        - !Ref InspectionAppSubnet2
      DesiredCapacity: 2
      MinSize: 2
      MaxSize: 4
      TargetGroupARNs:
        - !Ref IngressAlbTgLarge
      LaunchTemplate:
        LaunchTemplateId: !Ref BadAppLaunchTemplate
        Version: !GetAtt BadAppLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-bad-app
          PropagateAtLaunch: true

          
  # ------------------------------
  # Target Groups and ALB - Moved to Inspection VPC
  # ------------------------------
  IngressAlbTgSmall:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref InspectionVPC
      TargetType: instance
      Protocol: HTTP
      Port: 80
      HealthCheckPath: /
      Matcher: { HttpCode: "200" }

  IngressAlbTgLarge:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref InspectionVPC
      TargetType: instance
      Protocol: HTTP
      Port: 80
      HealthCheckPath: /
      Matcher: { HttpCode: "200" }

  # -----------------------------------------
  # ALB + Listener + Path rules
  # -----------------------------------------
  IngressALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ingress-alb
      Scheme: internet-facing
      Type: application
      Subnets: [ !Ref InspectionAlbSubnet1, !Ref InspectionAlbSubnet2 ]
      SecurityGroups: [ !Ref IngressAlbSg ]

  IngressAlbListener80:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref IngressALB
      Port: 80
      Protocol: HTTP
      # Default: healthy targets (home + small)
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref IngressAlbTgSmall

  # Explicit rules (optional for clarity)
  IngressAlbRuleIndex:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref IngressAlbListener80
      Priority: 8
      Conditions: 
        - Field: path-pattern
          Values: ["/index.html"]
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref IngressAlbTgSmall

  IngressAlbRuleOthers:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref IngressAlbListener80
      Priority: 9
      Conditions: 
        - Field: path-pattern
          Values: ["/*"]
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref IngressAlbTgLarge

  # ------------------------------
  # EC2 Instances
  # ------------------------------
  Instance1AZ1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref Subnet1AZ1
      SecurityGroupIds:
        - !Ref SecurityGroup1
      IamInstanceProfile: !Ref EC2InstanceProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y python3-pip cronie telnet
          yum install -y network-flow-monitor-agent
          yum install amazon-cloudwatch-agent -y
          systemctl enable crond
          systemctl start crond
          
          # Create virtual environment
          python3 -m venv /home/ec2-user/locust_venv
          source /home/ec2-user/locust_venv/bin/activate
          
          # Install Locust in virtual environment
          pip3 install locust
          chmod +x /home/ec2-user/locust_venv/bin/locust
          
          cat << 'EOF' > /home/ec2-user/locustfile.py
          from locust import HttpUser, task, between
          class WebsiteUser(HttpUser):
              wait_time = between(1, 2)
              @task
              def check_website(self):
                  self.client.get("/")
          EOF
          
          # Update cron jobs to use the virtual environment's Locust
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H https://checkip.amazonaws.com --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H https://aws.amazon.com --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://http-textarea.badssl.com/ --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://http.badssl.com/ --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H https://imdb.com --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
