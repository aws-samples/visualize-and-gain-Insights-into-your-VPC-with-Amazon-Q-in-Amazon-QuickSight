      VpcId: !Ref OnpremiseVPC

  OnpremiseStrongSwanRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref OnpremiseVPC

  OnpremiseInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: [OnPremisesIGWAttachment]
    Properties:
      RouteTableId: !Ref OnpremiseStrongSwanRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref OnPremisesIGW

  OnpremiseToStrongSwanRoute:
    Type: AWS::EC2::Route
    DependsOn: [StrongSwanInstance]
    Properties:
      RouteTableId: !Ref OnpremiseInstanceRouteTable
      DestinationCidrBlock: 0.0.0.0/0
