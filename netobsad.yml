        - !Ref ProdEndpointSecurityGroup

  ProdNetworkFlowMonitorEndpoint:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcId: !Ref InspectionVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.networkflowmonitor'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref InspectionAppSubnet1
        - !Ref InspectionAppSubnet2
