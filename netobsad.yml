  TransitGatewayInspectionRouteToWorkload2:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TransitGatewayInspectionRouteTable
      DestinationCidrBlock: '10.2.0.0/16'
      TransitGatewayAttachmentId: !Ref Workload2TransitGatewayAttachment

  TransitGatewayInspectionRouteToOnPrem:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TransitGatewayInspectionRouteTable
      DestinationCidrBlock: '10.3.0.0/16'
      TransitGatewayAttachmentId: !GetAtt TransitGatewayVpnAttachmentInfo.AttachmentId
  
  TransitGatewaySpokeRouteToWorkload1:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TransitGatewaySpokeRouteTable
      DestinationCidrBlock: '10.1.0.0/16'
      TransitGatewayAttachmentId: !Ref Workload1TransitGatewayAttachment

  TransitGatewaySpokeRouteToWorkload2:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TransitGatewaySpokeRouteTable
      DestinationCidrBlock: '10.2.0.0/16'
      TransitGatewayAttachmentId: !Ref Workload2TransitGatewayAttachment

  TransitGatewaySpokeRouteToOnPrem:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TransitGatewaySpokeRouteTable
      DestinationCidrBlock: '10.3.0.0/16'
      TransitGatewayAttachmentId: !GetAtt TransitGatewayVpnAttachmentInfo.AttachmentId


  TransitGatewayAttachmentLookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TransitGatewayLookupPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTransitGatewayAttachments
                Resource: "*"

  TransitGatewayAttachmentLookupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt TransitGatewayAttachmentLookupRole.Arn
      Runtime: python3.11
      Timeout: 120
      Handler: index.handler
      Code:
        ZipFile: |
          import boto3
          import json
          import time
          import urllib.request

          ec2 = boto3.client("ec2")
          MAX_WAIT = 300
          SLEEP_SECONDS = 5

          def send_response(event, context, status, data=None, reason=None, physical_id=None):
              body = {
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                  "PhysicalResourceId": physical_id or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {},
              }
              req = urllib.request.Request(
                  event["ResponseURL"],
                  data=json.dumps(body).encode("utf-8"),
                  headers={"content-type": ""},
                  method="PUT",
              )
              with urllib.request.urlopen(req) as resp:
                  resp.read()

          def find_attachment(vpn_id):
              waited = 0
              while waited <= MAX_WAIT:
                  resp = ec2.describe_transit_gateway_attachments(
                      Filters=[
                          {"Name": "resource-id", "Values": [vpn_id]},
                          {"Name": "resource-type", "Values": ["vpn"]},
                      ]
                  )
                  attachments = resp.get("TransitGatewayAttachments", [])
                  if attachments:
                      return attachments[0]["TransitGatewayAttachmentId"]
                  time.sleep(SLEEP_SECONDS)
                  waited += SLEEP_SECONDS
              raise RuntimeError(f"Transit Gateway attachment not found for {vpn_id}")

          def handler(event, context):
              request_type = event["RequestType"]
              vpn_id = event["ResourceProperties"]["VpnConnectionId"]
              physical_id = event.get("PhysicalResourceId")

              try:
                  if request_type in ("Create", "Update"):
                      attachment_id = find_attachment(vpn_id)
                      data = {"AttachmentId": attachment_id}
                      send_response(event, context, "SUCCESS", data=data, physical_id=attachment_id)
                  else:  # Delete
                      send_response(
                          event,
                          context,
                          "SUCCESS",
                          data={"AttachmentId": ""},
                          physical_id=physical_id or "deleted",
                      )
              except Exception as exc:
                  send_response(
                      event,
                      context,
                      "FAILED",
                      reason=str(exc),
                      physical_id=physical_id or "failed",
                  )

  TransitGatewayVpnAttachmentInfo:
    Type: Custom::TransitGatewayAttachmentLookup
    Properties:
      ServiceToken: !GetAtt TransitGatewayAttachmentLookupFunction.Arn
      VpnConnectionId: !Ref TransitGatewayVpnConnection


  # Internet Gateway and NAT gateways
  InspectionIGW:
    Type: AWS::EC2::InternetGateway

  AttachInspectionIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref InspectionVPC
      InternetGatewayId: !Ref InspectionIGW

  InspectionEIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  InspectionEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  TrafficGeneratorEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  InspectionNATGW1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt InspectionEIP1.AllocationId
      SubnetId: !Ref InspectionPublicSubnet1

  InspectionNATGW2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt InspectionEIP2.AllocationId
      SubnetId: !Ref InspectionPublicSubnet2

  # ------------------------------
  # Route Tables & Routes
  # ------------------------------

  ## Firewall route table
  InspectionRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InspectionVPC

  # 0.0.0.0/0 → NAT
  InspectionRouteToNAT:
    Type: AWS::EC2::Route
    DependsOn: [InspectionNATGW1]
    Properties:
      RouteTableId: !Ref InspectionRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref InspectionNATGW1

  # Workload CIDRs → Transit Gateway
  InspectionRouteToWorkloadVPC1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref InspectionRouteTable
      DestinationCidrBlock: '10.1.0.0/16'
      TransitGatewayId: !Ref TransitGateway
    DependsOn:
      - InspectionTransitGatewayAttachment

  InspectionRouteToWorkloadVPC2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref InspectionRouteTable
      DestinationCidrBlock: '10.2.0.0/16'
      TransitGatewayId: !Ref TransitGateway
    DependsOn:
      - InspectionTransitGatewayAttachment

  InspectionRouteToOnPremisesVPC:
