Resources:
  # ------------------------------
  # Transit Gateway Core Network
  # ------------------------------
  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: "Transit Gateway for centralized inspection routing"
      DefaultRouteTableAssociation: disable
      DefaultRouteTablePropagation: disable
      DnsSupport: enable
      VpnEcmpSupport: enable
      Tags:
        - Key: Name
          Value: transit-gateway-centralized-outbound

  TransitGatewaySpokeRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TransitGateway
      Tags:
        - Key: Name
          Value: transit-gateway-spoke-rt

  TransitGatewayInspectionRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TransitGateway
      Tags:
        - Key: Name
          Value: transit-gateway-inspection-rt

  # ------------------------------
  # Inspection VPC & Subnets
  # ------------------------------
  InspectionVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: '10.0.0.0/16'
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: Inspection-Ingress-VPC

  # Transit Gateway attachment subnets
  InspectionTgwSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.5.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: InspectionTgwSubnet1

  InspectionTgwSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.6.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: InspectionTgwSubnet2

  # Public subnets for NAT
