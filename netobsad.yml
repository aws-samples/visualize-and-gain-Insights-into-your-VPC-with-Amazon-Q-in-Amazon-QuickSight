                      }
                  },
                  {
                      "height": 1,
                      "width": 24,
                      "y": 2,
                      "x": 0,
                      "type": "text",
                      "properties": {
                          "markdown": "# Firewall Endpoints",
                          "background": "transparent"
                      }
