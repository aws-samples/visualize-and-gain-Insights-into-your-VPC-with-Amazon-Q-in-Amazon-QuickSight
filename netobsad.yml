      RouteTableId: !Ref OnpremiseInstanceRouteTable

  OnpremiseSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref OnpremiseSubnet2
      RouteTableId: !Ref OnpremiseInstanceRouteTable

  OnpremiseSubnet3Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
