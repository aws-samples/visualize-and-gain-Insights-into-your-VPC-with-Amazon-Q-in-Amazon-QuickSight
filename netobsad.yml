      SubnetId: !Ref InspectionAlbSubnet2
      RouteTableId: !Ref InspectionAlbRouteTable

  # App subnet associations
  InspectionAppSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
