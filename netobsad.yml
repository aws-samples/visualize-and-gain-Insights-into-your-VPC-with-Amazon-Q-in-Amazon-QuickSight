      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.8.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: InspectionPublicSubnet2

  # Internal inspection subnets
