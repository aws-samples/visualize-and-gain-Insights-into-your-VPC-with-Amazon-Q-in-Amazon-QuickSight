  # ------------------------------
  # Workload VPC Instance Route Tables & Routes
  # ------------------------------
  WorkloadVPC1InstanceRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkloadVPC1

  WorkloadVPC1DefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref WorkloadVPC1InstanceRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      TransitGatewayId: !Ref TransitGateway
    DependsOn:
      - Workload1TransitGatewayAttachment
      - TransitGatewaySpokeDefaultRoute

  WorkloadVPC1Subnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1AZ1
      RouteTableId: !Ref WorkloadVPC1InstanceRouteTable

  WorkloadVPC1Subnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1AZ2
      RouteTableId: !Ref WorkloadVPC1InstanceRouteTable

  WorkloadVPC2InstanceRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref WorkloadVPC2

  WorkloadVPC2DefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref WorkloadVPC2InstanceRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      TransitGatewayId: !Ref TransitGateway
    DependsOn:
