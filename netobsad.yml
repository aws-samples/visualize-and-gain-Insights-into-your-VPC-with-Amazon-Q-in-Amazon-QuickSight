    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InspectionVPC

  # 0.0.0.0/0 → Internet
  InspectionPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: [AttachInspectionIGW]
    Properties:
      RouteTableId: !Ref InspectionPublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InspectionIGW

  # Workload CIDRs → Firewall endpoints
  InspectionPublicRouteToWorkloadVPC1:
    Type: AWS::EC2::Route
    DependsOn: [NetworkFirewall]
    Properties:
      RouteTableId: !Ref InspectionPublicRouteTable
      DestinationCidrBlock: '10.1.0.0/16'
      VpcEndpointId: !Select
        - 1
        - !Split
          - ":"
          - !Select [0, !GetAtt NetworkFirewall.EndpointIds]

  InspectionPublicRouteToWorkloadVPC2:
    Type: AWS::EC2::Route
    DependsOn: [NetworkFirewall]
    Properties:
      RouteTableId: !Ref InspectionPublicRouteTable
      DestinationCidrBlock: '10.2.0.0/16'
      VpcEndpointId: !Select
        - 1
        - !Split
          - ":"
          - !Select [0, !GetAtt NetworkFirewall.EndpointIds]

  InspectionPublicRouteToWorkloadVPC3:
    Type: AWS::EC2::Route
    DependsOn: [NetworkFirewall]
    Properties:
      RouteTableId: !Ref InspectionPublicRouteTable
      DestinationCidrBlock: '10.3.0.0/16'
      VpcEndpointId: !Select
        - 1
        - !Split
          - ":"
          - !Select [0, !GetAtt NetworkFirewall.EndpointIds]

  ## Transit Gateway attachment subnets route table
  InspectionTgwRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InspectionVPC

  # ALB route table (public subnets)
  InspectionAlbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InspectionVPC

  # App route table (private subnets)
  InspectionAppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InspectionVPC

  # 0.0.0.0/0 → Firewall endpoints
  InspectionTgwDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: [NetworkFirewall]
    Properties:
      RouteTableId: !Ref InspectionTgwRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      VpcEndpointId: !Select
        - 1
        - !Split
          - ":"
          - !Select [0, !GetAtt NetworkFirewall.EndpointIds]

  # ALB subnet routes (internet access via IGW, app traffic via firewall)
  InspectionAlbDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: [AttachInspectionIGW]
    Properties:
      RouteTableId: !Ref InspectionAlbRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InspectionIGW


  # App subnet routes (internet via NAT, ALB traffic via firewall)
  InspectionAppDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: [InspectionNATGW1]
    Properties:
      RouteTableId: !Ref InspectionAppRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref InspectionNATGW1



  # ------------------------------
  # Subnet Associations
  # ------------------------------

  # Firewall subnets → InspectionRouteTable
  FirewallSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FirewallSubnet1
      RouteTableId: !Ref InspectionRouteTable

  FirewallSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FirewallSubnet2
      RouteTableId: !Ref InspectionRouteTable

  # Public subnets → InspectionPublicRouteTable
  InspectionPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref InspectionPublicSubnet1
      RouteTableId: !Ref InspectionPublicRouteTable

  InspectionPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref InspectionPublicSubnet2
      RouteTableId: !Ref InspectionPublicRouteTable

  # Transit Gateway attachment subnets → InspectionTgwRouteTable
  InspectionTgwSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
