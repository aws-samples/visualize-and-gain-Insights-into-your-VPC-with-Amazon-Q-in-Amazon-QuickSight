              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAbout">
              <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item active"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
              </ul>
            </div>
          </nav>

          <div class="container mt-4">
            <h1>About AnyCompany Energy</h1>
            <p>
              AnyCompany Energy was founded on the belief that renewable energy can be accessible, efficient, and affordable.
              Our mission is to pioneer eco-friendly solutions that drive a sustainable future for communities around the world.
