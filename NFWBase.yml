                              "position": "right"
                          },
                          "insightRule": {
                              "maxContributorCount": 10,
                              "orderBy": "Sum",
                              "ruleName": "${TopHTTPUserAgentsRule.RuleName}"
                          }
                      }
                  },
                  {
                      "height": 7,
                      "width": 6,
                      "y": 102,
                      "x": 0,
                      "type": "metric",
                      "properties": {
                          "period": 60,
                          "region": "${AWS::Region}",
                          "stacked": false,
                          "timezone": "local",
                          "title": "Top TLS SNI",
                          "view": "timeSeries",
                          "legend": {
                              "position": "right"
                          },
                          "insightRule": {
                              "maxContributorCount": 10,
                              "orderBy": "Sum",
                              "ruleName": "${TopTLSSNIRule.RuleName}"
                          }
                      }
                  },
                  {
                      "height": 7,
                      "width": 6,
                      "y": 102,
                      "x": 6,
                      "type": "metric",
                      "properties": {
                          "period": 60,
                          "insightRule": {
                              "maxContributorCount": 10,
                              "orderBy": "Sum",
                              "ruleName": "${TopBlockedTLSSNIRule.RuleName}"
                          },
                          "stacked": false,
                          "view": "timeSeries",
                          "yAxis": {
                              "left": {
                                  "showUnits": false
                              },
                              "right": {
                                  "showUnits": false
                              }
                          },
                          "region": "${AWS::Region}",
                          "title": "Top Blocked TLS SNI",
                          "legend": {
                              "position": "right"
                          }
                      }
                  },
                  {
                      "height": 7,
                      "width": 12,
                      "y": 102,
                      "x": 12,
                      "type": "log",
                      "properties": {
                          "query": "SOURCE '${FirewallAlertLogGroupName}' | stats count(*) as Count by event.src_ip as Source_IP, event.dest_ip as Dest_IP, event.app_proto as App_Proto, event.tls.sni as SNI, event.http.hostname as Hostname\n| filter event.tls.sni like \"s3\" or event.http.hostname like \"s3\" or event.tls.sni like \"dynamodb\" or event.http.hostname like \"dynamodb\" or event.tls.sni like \"backup\" or event.http.hostname like \"backup\"\n| display Source_IP, Dest_IP, App_Proto, SNI, Hostname, Count\n| sort Count desc\n| limit 10",
                          "region": "${AWS::Region}",
                          "title": "Top PrivateLink Endpoint Candidates (S3, DynamoDB, & Backup)",
                          "view": "table"
                      }
                    },
                    {
                      "height": 1,
                      "width": 24,
                      "y": 109,
                      "x": 0,
                      "type": "text",
                      "properties": {
                          "markdown": "## Generative AI",
                          "background": "transparent"
                      }
                  },
                  {
                      "type": "custom",
                      "x": 0,
                      "y": 110,
                      "width": 24,
                      "height": 6,
                      "properties": {
                        "endpoint": "${BedrockLogCWFunctionArn}",
                        "title": "Using AI in Log Analysis",
                        "params": {
                          "log_group_arn": {
                            "type": "text",
                            "label": "Log Group ARN",
                            "default": "${FirewallAlertLogGroupName}"
                          },
                          "custom_prompt": {
                            "type": "text",
                            "label": "Your Prompt",
                            "default": ""
                          }
                        },
                        "updateOn": {
                          "refresh": true,
                          "timeRange": true
                        }
                      }
                    }
                  ]
                }
        - subnet_query_string: !GetAtt GenerateSubnetQueryStringCustomResource.SubnetQueryString
          BedrockLogCWFunctionArn: !GetAtt BedrockLogCWFunction.Arn
          FirewallAlertLogGroupName: !Ref FirewallAlertLogGroupName  
      DashboardName: !Sub  ${FirewallName}-dashboard

Outputs:

  FirewallEndpoints:
    Description: "Network Firewall Endpoints"
    Value: !Join [ ",", !GetAtt NetworkFirewall.EndpointIds ]

  InstanceIDs:
    Description: "EC2 Instance IDs"
    Value:
      !Join
        - ','
        - - !Ref Instance1AZ1
          - !Ref Instance1AZ2
          - !Ref Instance2AZ1
          - !Ref Instance2AZ2
          - !Ref Instance3AZ1
          - !Ref Instance3AZ2

  FirewallLogGroups:
    Description: "Firewall Log Groups"
    Value:
      !Join
        - ','
        - - !Ref FirewallLogGroup
          - !Ref FirewallAlertLogGroup

  FirewallDashboardURI:
    Description: Link to the CloudWatch Dashboard
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${FirewallDashboard}'
