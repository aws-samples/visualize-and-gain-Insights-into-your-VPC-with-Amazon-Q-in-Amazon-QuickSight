    Type: AWS::CloudWatch::InsightRule
    Properties:
      RuleBody: !Sub |
        {
            "AggregateOn": "Count",
            "Contribution": {
            "Filters": [{
              "Match": "$.event.netflow.age",
              "GreaterThan": 350
            },
            {
              "Match": "$.event.proto",
              "In": [
                  "TCP"
              ]
            }
            ],
            "Keys": [
              "$.event.src_ip",
              "$.event.src_port",
              "$.event.dest_ip",
              "$.event.dest_port"
            ]
            },
            "LogFormat": "JSON",
            "Schema": {
            "Name": "CloudWatchLogRule",
            "Version": 1
