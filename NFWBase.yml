AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Network Firewall, One Production/Inspection VPCs (six EC2 instances). All instances use SSM (via IAM Instance Profile) for access.
  This template includes complete UserData scripts for all instances.

Parameters:
  InstanceType:
    Type: String
    Default: 't3.micro'
  FirewallName:
    Type: String
    Description: Name of the network firewall (used in both firewall and dashboard)
    Default: 'CentralizedFirewall'
  ContributorInsightsRuleState:
        Type: String
        Description: Choose to enable or disable the Contributor Insight rules created by this template
        Default: ENABLED
        AllowedValues:
          - ENABLED
          - DISABLED
  FirewallAlertLogGroupName:
    Type: String
    Description: Name of the Firewall Alert Log Group
    Default: '/aws/network-firewall/alert'
  
  FirewallFlowLogGroupName:
    Type: String
    Description: Name of the Firewall Flow Log Group
    Default: '/aws/network-firewall/flow'

Resources:

  # ------------------------------
  # Inspection VPC & Subnets
  # ------------------------------
  InspectionVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: '10.0.0.0/16'
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: InspectionVPC

  # Public subnets for NAT
  InspectionPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.7.0/24'
      AvailabilityZone: !Select [0, !GetAZs ""] 
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: InspectionPublicSubnet1

  InspectionPublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.8.0/24'
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: InspectionPublicSubnet2


  # Firewall subnets
  FirewallSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.3.0/24'
      AvailabilityZone: !Select [0, !GetAZs ""] 
      Tags:
        - Key: Name
          Value: FirewallSubnet1

  FirewallSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.4.0/24'
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: FirewallSubnet2

    # Instance attachment subnets
  WorkloadSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.5.0/24'
      AvailabilityZone: !Select [0, !GetAZs ""] 
      Tags:
        - Key: Name
          Value: WorkloadSubnet1

  WorkloadSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref InspectionVPC
      CidrBlock: '10.0.6.0/24'
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: WorkloadSubnet2


  # Internet Gateway and NAT gateways
  InspectionIGW:
    Type: AWS::EC2::InternetGateway

  AttachInspectionIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref InspectionVPC
      InternetGatewayId: !Ref InspectionIGW

  InspectionEIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  InspectionEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  InspectionNATGW1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt InspectionEIP1.AllocationId
      SubnetId: !Ref InspectionPublicSubnet1

  InspectionNATGW2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt InspectionEIP2.AllocationId
      SubnetId: !Ref InspectionPublicSubnet2

  # ------------------------------
  # Route Tables & Routes
  # ------------------------------

  ## Firewall route table
  InspectionRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InspectionVPC

  InspectionRouteToNAT1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref InspectionRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref InspectionNATGW1



  ## Public route table
  InspectionPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InspectionVPC

  # 0.0.0.0/0 → Internet
  InspectionPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: [AttachInspectionIGW]
    Properties:
      RouteTableId: !Ref InspectionPublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InspectionIGW

    # Workload CIDRs 

  InspectionPublicRouteToWorkloadSubnet1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref InspectionPublicRouteTable
      DestinationCidrBlock: '10.0.5.0/24'
      VpcEndpointId: !Select
        - 1
        - !Split
          - ":"
          - !Select [0, !GetAtt NetworkFirewall.EndpointIds]

  InspectionPublicRouteToWorkloadSubnet2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref InspectionPublicRouteTable
      DestinationCidrBlock: '10.0.6.0/24'
      VpcEndpointId: !Select
        - 1
        - !Split
          - ":"
          - !Select [0, !GetAtt NetworkFirewall.EndpointIds]

    # ------------------------------
  # Workload VPC Instance Route Tables & Routes
  # ------------------------------
  WorkloadInstanceRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref InspectionVPC

  WorkloadVPCDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref WorkloadInstanceRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      VpcEndpointId: !Select
        - 1
        - !Split
          - ":"
          - !Select [0, !GetAtt NetworkFirewall.EndpointIds]

  WorkloadSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WorkloadSubnet1
      RouteTableId: !Ref WorkloadInstanceRouteTable

  WorkloadSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WorkloadSubnet2
      RouteTableId: !Ref WorkloadInstanceRouteTable

  # ------------------------------
  # Subnet Associations
  # ------------------------------

  # Firewall subnets → InspectionRouteTable
  FirewallSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FirewallSubnet1
      RouteTableId: !Ref InspectionRouteTable

  FirewallSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FirewallSubnet2
      RouteTableId: !Ref InspectionRouteTable

  # Public subnets → InspectionPublicRouteTable
  InspectionPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref InspectionPublicSubnet1
      RouteTableId: !Ref InspectionPublicRouteTable

  InspectionPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref InspectionPublicSubnet2
      RouteTableId: !Ref InspectionPublicRouteTable


  # ------------------------------
  # Network Firewall & Logging
  # ------------------------------
  NetworkFirewall:
    Type: AWS::NetworkFirewall::Firewall
    Properties:
      FirewallName: !Ref FirewallName
      FirewallPolicyArn: !Ref FirewallPolicy
      VpcId: !Ref InspectionVPC
      SubnetMappings:
        - SubnetId: !Ref FirewallSubnet1
        - SubnetId: !Ref FirewallSubnet2
      EnabledAnalysisTypes:
        - TLS_SNI
        - HTTP_HOST

  FirewallPolicy:
    Type: AWS::NetworkFirewall::FirewallPolicy
    Properties:
      FirewallPolicyName: 'DemoPolicy'
      FirewallPolicy:
        StatelessDefaultActions: ['aws:forward_to_sfe']
        StatelessFragmentDefaultActions: ['aws:forward_to_sfe']
        StatefulRuleGroupReferences:
          - ResourceArn: !Ref SuricataRuleGroup
            Priority: 100
          - ResourceArn: !Ref StandardStatefulRuleGroup
            Priority: 150
          - ResourceArn: !Ref DomainRuleGroup
            Priority: 200
        StatefulDefaultActions:
          - aws:alert_established
        StatefulEngineOptions:
          RuleOrder: STRICT_ORDER

  StandardStatefulRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: StandardStatefulRuleGroup
      Type: STATEFUL
      Capacity: 100
      RuleGroup:
        RulesSource:
          StatefulRules:
            - Action: DROP
              Header:
                Protocol: UDP
                Source: 10.1.0.0/16
                SourcePort: ANY
                Direction: ANY
                Destination: ANY
                DestinationPort: ANY
              RuleOptions:
                - Keyword: "sid:1"
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER

  SuricataRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: 'SuricataRules'
      Type: STATEFUL
      Capacity: 100
      RuleGroup:
        RulesSource:
          RulesString: |
            drop http $HOME_NET any -> $EXTERNAL_NET any (http.host; content:"neverssl.com"; startswith; endswith; msg:"matching HTTP denylisted FQDNs"; flow:to_server, established; sid:10002; rev:1;)
            drop tls $HOME_NET any -> $EXTERNAL_NET any (ssl_state:client_hello; tls.sni; content:"twitch.tv"; startswith; nocase; endswith; msg:"Blocking twitch"; flow:to_server, established; sid:10003; rev:1;)
            drop tls $HOME_NET any -> $EXTERNAL_NET any (ssl_state:client_hello; tls.sni; content:"imdb.com"; startswith; nocase; endswith; msg:"Blocking IMDB"; flow:to_server, established; sid:10004; rev:1;)
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER

  DomainRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: 'DomainRules'
      Type: STATEFUL
      Capacity: 100
      RuleGroup:
        RuleVariables:
          IPSets:
            HOME_NET:
              Definition: ['10.0.0.0/8']
        RulesSource:
          RulesSourceList:
            Targets: ['alexa.com', 'ring.com', 'www.twitch.tv', "neverssl.com"]
            TargetTypes: ['TLS_SNI', 'HTTP_HOST']
            GeneratedRulesType: DENYLIST
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER

  FirewallLoggingConfiguration:
    Type: AWS::NetworkFirewall::LoggingConfiguration
    Properties:
      FirewallArn: !Ref NetworkFirewall
      LoggingConfiguration:
        LogDestinationConfigs:
          - LogType: FLOW
            LogDestinationType: CloudWatchLogs
            LogDestination:
              logGroup: !Ref FirewallLogGroup
          - LogType: ALERT
            LogDestinationType: CloudWatchLogs
            LogDestination:
              logGroup: !Ref FirewallAlertLogGroup

  FirewallLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref FirewallFlowLogGroupName
      RetentionInDays: 7

  FirewallAlertLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref FirewallAlertLogGroupName
      RetentionInDays: 7



  # ------------------------------
  # EC2 Instances
  # ------------------------------
  Instance1AZ1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: ami-0440d3b780d96b29d
      SubnetId: !Ref WorkloadSubnet1
      SecurityGroupIds:
        - !Ref SecurityGroup1
      IamInstanceProfile: !Ref EC2InstanceProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y python3-pip cronie telnet
          systemctl enable crond
          systemctl start crond
          
          # Create virtual environment
          python3 -m venv /home/ec2-user/locust_venv
          source /home/ec2-user/locust_venv/bin/activate
          
          # Install Locust in virtual environment
          pip3 install locust
          chmod +x /home/ec2-user/locust_venv/bin/locust
          
          cat << 'EOF' > /home/ec2-user/locustfile.py
          from locust import HttpUser, task, between
          class WebsiteUser(HttpUser):
              wait_time = between(1, 2)
              @task
              def check_website(self):
                  self.client.get("/")
          EOF
          
          # Update cron jobs to use the virtual environment's Locust
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H https://checkip.amazonaws.com --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H https://aws.amazon.com --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://http-textarea.badssl.com/ --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://http.badssl.com/ --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          
          DOMAINS=(
          "checkip.amazonaws.com"
          "aws.amazon.com"
          )

          for d in "${DOMAINS[@]}"; do
          echo "*/10 * * * * dig @8.8.8.8 $d +short >> /var/log/dns-8.8.8.8.log 2>&1" \
            >> /var/spool/cron/ec2-user
          echo "*/10 * * * * dig @8.8.4.4 $d +short >> /var/log/dns-8.8.4.4.log 2>&1" \
            >> /var/spool/cron/ec2-user
          done
          
          PING_HOSTS=(
            "amazon.com"
            "nova.amazon.com"
          )
          for h in "${PING_HOSTS[@]}"; do
            echo "*/5 * * * * ping -c 4 \$h >> \
          /var/log/ping-\$h.log 2>&1" >> /var/spool/cron/ec2-user
          done

          for d in "${DOMAINS[@]}"; do
            echo "*/5 * * * * (echo 'quit' | telnet \$d 80) >> /var/log/telnet-\$d.log 2>&1" \
              >> /var/spool/cron/ec2-user
          done
  Instance1AZ2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: ami-0440d3b780d96b29d
      SubnetId: !Ref WorkloadSubnet2
