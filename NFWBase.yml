            >> /var/spool/cron/ec2-user
          done

          PING_HOSTS=(
            "amazon.com"
            "nova.amazon.com"
          )
          for h in "${PING_HOSTS[@]}"; do
            echo "*/5 * * * * ping -c 40 \$h >> \
          /var/log/ping-\$h.log 2>&1" >> /var/spool/cron/ec2-user
          done

