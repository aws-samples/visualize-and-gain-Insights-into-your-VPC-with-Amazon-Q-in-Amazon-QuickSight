  BedrockLogCWFunction:
    DependsOn: ScopedCustomPolicy
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "This function does not access any VPC resources"
    Properties:
      LoggingConfig:
        LogGroup: !Ref LambdaFunctionLogGroup
      FunctionName: BedrockLogAnalysisFunction
      Handler: index.lambda_handler
      Role: !GetAtt LambdaBedrockCwExecutionRole.Arn
      Environment:
        Variables:
          cache_name: !Ref BedrockCacheTable
      Runtime: python3.12
      ReservedConcurrentExecutions: 5
      Timeout: 45
      Code:
        ZipFile: |
          import os
          import time
          import json
          from dataclasses import dataclass
          from typing import Optional
          import boto3
          from botocore.exceptions import ClientError

          MAX_RETRIES = 3
          BACKOFF_FACTOR = 2
          MAX_CHAR_INPUT = 128000  # Truncate to fit model token limits safely

          @dataclass
          class CacheItem:
              log_group_arn: str
              summary: str
              timestamp: int

          def get_summary_cache(log_group_arn: str) -> Optional[CacheItem]:
              dynamodb = boto3.resource("dynamodb")
              table = dynamodb.Table(os.environ["cache_name"])
              try:
                  resp = table.get_item(Key={"log_group_arn": log_group_arn})
              except ClientError:
                  return None
              item = resp.get("Item")
              return CacheItem(**item) if item else None

          def put_summary(log_group_arn: str, summary: str) -> None:
              dynamodb = boto3.resource("dynamodb")
              table = dynamodb.Table(os.environ["cache_name"])
              table.put_item(Item={
                  "log_group_arn": log_group_arn,
                  "summary": summary,
                  "timestamp": int(time.time()),
              })

          def bedrock_analyze(log_text: str, user_prompt: str) -> str:
              base_prompt = user_prompt.strip() or "Please create some insights on the following log string"
              client = boto3.client("bedrock-runtime")

              # Truncate input to avoid model overload
              truncated_log = log_text[:MAX_CHAR_INPUT]
              full_prompt = f"{base_prompt}. {truncated_log}"

              body = {
                  "schemaVersion": "messages-v1",
                  "system": [
                      { "text": base_prompt }
                  ],
                  "messages": [
                      {
                          "role": "user",
                          "content": [
                              { "text": truncated_log }
                          ]
                      }
                  ],
                  "inferenceConfig": {
                      "maxTokens": 1000,
                      "temperature": 0,
                      "topP": 1,
                      "stopSequences": []
                  }
              }

              blob = bytes(json.dumps(body), "utf-8")
              retry_count = 0

              while retry_count < MAX_RETRIES:
                  try:
                      response = client.invoke_model(
                          modelId="amazon.nova-micro-v1:0",
                          body=blob,
                          contentType="application/json",
                      )
                      resp_blob = response["body"].read().decode("utf-8")
                      data = json.loads(resp_blob)

                       # New primary path (current Bedrock “output” shape)
                      if "output" in data and "message" in data["output"]:
                          text = data["output"]["message"]["content"][0]["text"]

                      # Messages-API path
                      elif "messages" in data and data["messages"]:
                          text = data["messages"][0]["content"][0]["text"]

                      # Legacy text-generation path
                      elif "content" in data and data["content"]:
                          item = data["content"][0]
                          text = item.get("text") or item.get("generatedText", "")

                      else:
                          raise KeyError(f"No usable text; keys: {list(data.keys())}")

                      return text.replace("\n", "<br />")

                  except client.exceptions.ThrottlingException:
                      time.sleep(BACKOFF_FACTOR ** retry_count)
                      retry_count += 1
                  except Exception as e:
                      return f"<b>Error:</b> {str(e)}"

              return "<b>Error:</b> Max retries reached"

          def recent_log_stream(log_group_arn: str) -> str:
              logs = boto3.client("logs")
              resp = logs.describe_log_streams(
                  logGroupIdentifier=log_group_arn,
                  orderBy='LastEventTime',
                  descending=True
              )
              streams = resp.get("logStreams", [])
              if not streams:
                  raise Exception("No log streams found")
              return streams[0]["logStreamName"]

          def fetch_analysis(log_group_arn: str, user_prompt: str) -> str:
              logs = boto3.client("logs")
              stream = recent_log_stream(log_group_arn)
              resp = logs.get_log_events(
                  logGroupIdentifier=log_group_arn,
                  logStreamName=stream,
                  limit=50
              )
              events = resp.get("events", [])
              if not events:
                  raise Exception("No events to analyze")
              joined = "\n".join(f"[{e['timestamp']}] {e['message']}" for e in events)
              analysis = bedrock_analyze(joined, user_prompt)
              put_summary(log_group_arn, analysis)
              return analysis

          def lambda_handler(event, context):
              if event.get("describe"):
                  return """## Bedrock Log Analysis Widget
                  **Parameters:**
                  - log_group_arn: ARN of the log group to summarize  
                  - custom_prompt: (optional) Lead-in text for analysis
                  """

              params = event.get("widgetContext", {}).get("params", {})
              lg_arn = params.get("log_group_arn")
              prompt = params.get("custom_prompt", "")

              if isinstance(lg_arn, dict):
                  lg_arn = lg_arn.get("default", "")
              if isinstance(prompt, dict):
                  prompt = prompt.get("default", "")

              if not lg_arn:
                  return "Error: Missing 'log_group_arn'."

              summary = fetch_analysis(lg_arn, prompt)

              enc = lg_arn.replace("/", "$252F")
              overview = f"https://console.aws.amazon.com/cloudwatch/home#logsV2:log-groups/log-group/{enc}"
              insights = f"https://console.aws.amazon.com/cloudwatch/home#logsV2:logs-insights$3Fsource~(~'{enc})"
              tail = f"https://console.aws.amazon.com/cloudwatch/home#logsV2:live-tail$3FlogGroupArns$3D~(~'{enc})"

              html = f"""
              <h2>Last 50 events</h2>
              <p>{summary}</p>
              <a class="btn btn-primary">Refresh</a>
              <cwdb-action action="call" endpoint="{context.invoked_function_arn}">
                {{ "log_group_arn": "{lg_arn}", "custom_prompt": "{prompt}" }}
              </cwdb-action>
              <a class="btn btn-primary" href="{overview}">Overview</a>
              <a class="btn btn-primary" href="{insights}">Insights</a>
              <a class="btn btn-primary" href="{tail}">Live Tail</a>
              """
              return html

   ##### Custom Resource #####

    # Lambda Function Converts Subnet List to String for Substition in PrivateLink Metric Search Expressions
  GenerateSubnetQueryStringFunction:
      Type: AWS::Lambda::Function
      Properties:
        Handler: index.lambda_handler
        Role: !GetAtt  GenerateSubnetQueryStringFunctionRole.Arn
        Runtime: python3.9
        Code:
          ZipFile: |
            import cfnresponse
            import boto3
            import botocore
            import logging
            import json

            logger = logging.getLogger()
            logger.setLevel(logging.INFO)

            def lambda_handler(event, context):
                logger.info(f"Got event\n{json.dumps(event,indent=4, sort_keys=False)}")
                responseData = {}
                subnets = event['ResourceProperties']['FirewallSubnetList']

                try:
                    logger.info(f'Incoming RequestType: {event["RequestType"]}')

                    # send success signal on delete
                    if event['RequestType'] in ["Delete"]:
                        cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

                    if event['RequestType'] in ["Create","Update"]:
                      responseData = {}
                      subnet_assignment = []
                      for subnet in subnets:
                          subnet_assignment.append(f'\\"Subnet Id\\"=\\"{subnet}\\"')
                      subnet_query_string=' OR '.join(subnet_assignment)
                      logger.info(subnet_query_string)
                      responseData['SubnetQueryString']=subnet_query_string
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
                except Exception as err:
                    error_msg = str(err)
                    logger.warning(error_msg)
                    responseData = {"Data": error_msg}
                    cfnresponse.send(event, context, cfnresponse.FAILED, responseData)
                    raise err
                return

    #Custom Resource For Subnet List to String
  GenerateSubnetQueryStringCustomResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt GenerateSubnetQueryStringFunction.Arn
