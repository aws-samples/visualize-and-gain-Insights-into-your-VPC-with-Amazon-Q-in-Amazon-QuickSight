          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://neverssl.com --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          echo "*/10 * * * * sudo /home/ec2-user/locust_venv/bin/locust -f /home/ec2-user/locustfile.py --headless -u 50 -r 10 -H http://httpforever.com --run-time 5m >> /home/ec2-user/locust-cron.log 2>&1" \ >> /var/spool/cron/ec2-user
          
          DOMAINS=(
          "checkip.amazonaws.com"
