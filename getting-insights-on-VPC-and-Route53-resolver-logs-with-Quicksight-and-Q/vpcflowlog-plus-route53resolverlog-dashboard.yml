  QuickSightDataSchedule:
    DependsOn: QuickSightTopic
    Type: 'AWS::QuickSight::RefreshSchedule'
    Properties:
      AwsAccountId:
        'Fn::Sub': '${AWS::AccountId}'
      DataSetId: !Sub 'vpc_flowlogs_with_dns_query_dataset-${AWS::Region}'
      Schedule:
        RefreshType: FULL_REFRESH
        ScheduleFrequency:
          Interval: HOURLY
          TimeOfTheDay: '23:00'
          TimeZone: America/New_York
        ScheduleId: !Sub 'vpcflowlogs-qs-schedule-${AWS::Region}'

Outputs:
  VPCNamedQueryId:
    Description: 'The ID of the created Athena Named Query'
    Value: !Ref AthenaVPCNamedQuery
  R53LogsQueryId:
    Description: 'The ID of the created Athena Named Query for R53 Logs'
    Value: !Ref AthenaDNSNamedQuery
  FlowLogId:
    Description: The ID of the VPC Flow Log
    Value: !Ref VPCFlowLog
  FlowLogsBucketArn:
    Description: The ARN of the S3 bucket for Flow Logs
    Value: !If
      - CreateFlowLogsBucket
      - !GetAtt FlowLogsBucket.Arn
      - !Sub 'arn:aws:s3:::${FlowLogsBucketName}'
  DNSLogsBucketArn:
    Description: The ARN of the S3 bucket for Route 53 DNS Query Logs
    Value: !If
      - CreateDNSLogsBucket
      - !GetAtt DNSLogsBucket.Arn
      - !Sub 'arn:aws:s3:::${DNSLogsBucketName}'
  Route53QueryLoggingConfigId:
    Description: The ID of the Route 53 Query Logging Configuration
    Value: !Ref Route53QueryLoggingConfig

