### Custom resource for Delay (sleep), Required as QSTopic may fail if QsDataSchedule is running
  QsDataScheduleDelay:
    Type: 'Custom::Delay'
    DependsOn: 
      - QsDataSchedule
    Properties:
      ServiceToken: !GetAtt DelayFunction.Arn
      TimeToWait: 120
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      RoleName: "IAMRoleLambdaDelayer"
      Policies:
        - PolicyName: "lambda-logs"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - "arn:aws:logs:*:*:*"
  DelayFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      Handler: "index.handler"
      Timeout: 180
      Role: !GetAtt 'LambdaRole.Arn'
      Runtime: python3.12
      Code:
        ZipFile: |
          import json
          import cfnresponse
          import time
          def handler(event, context):
            try:
              time_to_wait = int(event['ResourceProperties']['TimeToWait'])
              print('wait started')
              time.sleep(time_to_wait)
              responseData = {}
              responseData['Data'] = "wait complete"
              print("wait completed")
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
